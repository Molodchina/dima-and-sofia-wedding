<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex,nofollow,noarchive,nosnippet,noimageindex" />
  <title>Ответы гостей — Свадьба Дмитрия и Софьи</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    body{margin:0;background:#f7f1ea;color:#3b342f;font-family:Inter,sans-serif;padding:24px}
    .wrap{max-width:1100px;margin:0 auto}
    .card{background:#fffaf4;border:1px solid rgba(133,117,104,.25);border-radius:24px;box-shadow:0 18px 50px rgba(75,57,44,.10);padding:22px}
    h1,h2{font-family:'Cormorant Garamond',serif;margin:0 0 12px}
    .top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:18px}
    button{border:1px solid #8c6b4e;background:#8c6b4e;color:#fff;border-radius:999px;padding:12px 16px;cursor:pointer;font-weight:600}
    table{width:100%;border-collapse:collapse;font-size:14px}
    th,td{padding:12px;border-bottom:1px dashed rgba(133,117,104,.32);vertical-align:top;text-align:left}
    th{font-size:12px;text-transform:uppercase;letter-spacing:.12em;color:#73685f}
    .muted{color:#73685f}
    .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:18px}
    .stat{padding:16px;border:1px dashed rgba(133,117,104,.35);border-radius:18px;background:#fff}
    .stat strong{display:block;font-size:28px;font-family:'Cormorant Garamond',serif}
  </style>
</head>
<body>
  <div class="wrap">
    <div class="top">
      <div>
        <h1>Ответы гостей</h1>
        <p class="muted">Локальный просмотр ответов из браузера. Для общего доступа можно подключить Google Sheets или серверный webhook.</p>
      </div>
      <button id="exportCsv">Скачать CSV</button>
    </div>

    <div class="card">
      <div class="stats" id="stats"></div>
      <table>
        <thead>
          <tr>
            <th>Ссылка</th>
            <th>Гости</th>
            <th>Ответ</th>
            <th>Контакт</th>
            <th>Комментарий</th>
            <th>Дата</th>
          </tr>
        </thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
  </div>

  <script>
    const index = JSON.parse(localStorage.getItem('wedding-rsvp:index') || '[]');
    const rows = document.getElementById('rows');
    const stats = document.getElementById('stats');
    const responses = index.map(item => {
      const data = JSON.parse(localStorage.getItem(`wedding-rsvp:${item.inviteSlug}`) || '{}');
      return data;
    }).filter(Boolean);

    const total = responses.length;
    const declined = responses.filter(r => (r.attendance || '').includes('не смогу')).length;
    const ceremony = responses.filter(r => (r.attendance || '').includes('венчании') || (r.attendance || '').includes('росписи')).length;

    stats.innerHTML = `
      <div class="stat"><strong>${total}</strong><span>Всего ответов</span></div>
      <div class="stat"><strong>${Math.max(total - declined, 0)}</strong><span>Придут</span></div>
      <div class="stat"><strong>${declined}</strong><span>Не смогут</span></div>
      <div class="stat"><strong>${ceremony}</strong><span>Участвуют хотя бы в одной части дня</span></div>
    `;

    rows.innerHTML = responses.map(r => `
      <tr>
        <td>${r.inviteSlug || ''}</td>
        <td>${(r.guests || []).join(', ')}</td>
        <td>${r.attendance || ''}</td>
        <td>${r.contact || ''}</td>
        <td>${r.comment || ''}</td>
        <td>${r.submittedAt ? new Date(r.submittedAt).toLocaleString('ru-RU') : ''}</td>
      </tr>
    `).join('') || '<tr><td colspan="6">Пока нет сохранённых ответов.</td></tr>';

    document.getElementById('exportCsv').addEventListener('click', () => {
      const header = ['Ссылка','Гости','Ответ','Контакт','Комментарий','Дата'];
      const lines = responses.map(r => [
        r.inviteSlug || '',
        (r.guests || []).join(', '),
        r.attendance || '',
        r.contact || '',
        r.comment || '',
        r.submittedAt ? new Date(r.submittedAt).toLocaleString('ru-RU') : ''
      ]);
      const csv = [header, ...lines].map(row => row.map(cell => `"${String(cell).replace(/"/g, '""')}"`).join(',')).join('\n');
      const blob = new Blob(['\uFEFF' + csv], { type: 'text/csv;charset=utf-8;' });
      const link = document.createElement('a');
      link.href = URL.createObjectURL(blob);
      link.download = 'wedding-rsvp.csv';
      link.click();
      URL.revokeObjectURL(link.href);
    });
  </script>
</body>
</html>
