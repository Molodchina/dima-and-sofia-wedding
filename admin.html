<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex,nofollow,noarchive,nosnippet" />
  <title>Админка — свадьба Дмитрия и Софьи</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="admin.css" />
</head>
<body>
  <main class="admin-shell">
    <section id="loginView" class="admin-card admin-login">
      <p class="admin-eyebrow">Дмитрий и Софья</p>
      <h1>Вход в админку</h1>
      <p class="admin-lead">Введите данные администратора, указанные в переменных окружения на сервере.</p>

      <form id="adminLoginForm" class="admin-form">
        <label>
          <span>Email</span>
          <input type="email" name="email" autocomplete="username" required />
        </label>
        <label>
          <span>Пароль</span>
          <input type="password" name="password" autocomplete="current-password" minlength="8" required />
        </label>
        <button type="submit" class="admin-button admin-button--primary">Войти</button>
        <p id="loginStatus" class="admin-status" aria-live="polite"></p>
      </form>
    </section>

    <section id="dashboardView" class="admin-dashboard" hidden>
      <header class="admin-header">
        <div>
          <p class="admin-eyebrow">Панель организаторов</p>
          <h1>Ответы гостей</h1>
        </div>
        <div class="admin-actions">
          <button id="reloadResponses" type="button" class="admin-button">Обновить</button>
          <button id="exportCsv" type="button" class="admin-button">Скачать CSV</button>
          <button id="logoutButton" type="button" class="admin-button admin-button--danger">Выйти</button>
        </div>
      </header>

      <div class="admin-summary">
        <article><span>Всего приглашений</span><strong id="summaryTotal">0</strong></article>
        <article><span>Ответили</span><strong id="summaryAnswered">0</strong></article>
        <article><span>Планируют быть</span><strong id="summaryAttending">0</strong></article>
        <article><span>Не смогут быть</span><strong id="summaryDeclined">0</strong></article>
      </div>

      <p id="dashboardStatus" class="admin-status" aria-live="polite"></p>

      <div class="admin-table-wrap">
        <table class="admin-table">
          <thead>
            <tr>
              <th>Гости</th>
              <th>Статус</th>
              <th>Контакт</th>
              <th>Комментарий</th>
              <th>Обновлено</th>
              <th>Slug</th>
              <th>Макс.</th>
            </tr>
          </thead>
          <tbody id="responsesBody"></tbody>
        </table>
      </div>
    </section>
  </main>

  <script src="config.js"></script>
  <script src="admin.js"></script>
</body>
</html>
